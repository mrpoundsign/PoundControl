version: 2

project_name: poundcontrol

before:
  hooks:
    - go mod tidy

builds:
  - skip: true

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: mrpoundsign
    name: PoundControl
  draft: false
  prerelease: auto
  mode: keep-existing

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
