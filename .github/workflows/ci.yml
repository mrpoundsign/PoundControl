name: CI Quality Gate

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'testdata/**'
      - 'build.sh'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'testdata/**'
      - 'build.sh'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint & Test Suite (Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI & Font Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev fonts-dejavu-core

      - name: Run go fix -diff
        run: |
          DIFF="$(go fix -diff ./cmd/... ./internal/... ./pkg/...)"
          if [ -n "$DIFF" ]; then
            echo "$DIFF"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./cmd/... ./internal/... ./pkg/...

      - name: Run golangci-lint (v2)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./cmd/... ./internal/... ./pkg/...

      - name: Run Full Test Suite
        run: |
          go test -count=1 ./cmd/... ./internal/... ./pkg/...
          go test -race -count=1 ./cmd/... ./internal/app/... ./internal/hotkey/... ./internal/webdeck/... ./pkg/builtin/... ./pkg/deck/... ./pkg/plugin/... ./pkg/pluginmgr/... ./pkg/sdplugin/... ./pkg/secrets/... ./pkg/tile/...
