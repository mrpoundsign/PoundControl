name: Release PoundControl

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    name: Determine Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      is_tag: ${{ steps.meta.outputs.is_tag }}
    steps:
      - name: Compute Release Metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RAW_VER="${TAG_NAME#v}"
            IS_TAG="true"
          else
            RAW_VER="0.1.0-snapshot"
            TAG_NAME="v${RAW_VER}"
            IS_TAG="false"
          fi
          IS_PRERELEASE="false"
          if [[ "${RAW_VER}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "version=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"

  test:
    name: Run Test Suite & Validation
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI & Audio Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev fonts-dejavu-core

      - name: Check Go Modernization
        run: |
          diff=$(go fix -diff ./...)
          if [ -n "$diff" ]; then
            echo "Go modernization diff found:"
            echo "$diff"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint (v2)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Validate GoReleaser Config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Run Full Test Suite
        run: go test -count=1 -v ./...

  build-gui-linux-windows:
    name: Build Desktop GUI & Installer (Linux & Windows)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI, Audio & MinGW Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-mingw-w64 gcc libgl1-mesa-dev xorg-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxxf86vm-dev libwayland-dev libxkbcommon-dev libasound2-dev fonts-dejavu-core

      - name: Compile Linux and Windows Studio & Installer
        run: |
          mkdir -p release-assets
          TAG="${{ needs.meta.outputs.tag }}"
          VER="${{ needs.meta.outputs.version }}"
          chmod +x ./build.sh

          echo "Building Linux amd64 Studio archive..."
          VERSION="$VER" ./build.sh gui
          STAGE="build/stage/PoundControl_${TAG}_linux_amd64"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -f build/bin/poundcontrol "$STAGE/poundcontrol"
          [ -f LICENSE ] && cp -f LICENSE "$STAGE/LICENSE"
          [ -f README.md ] && cp -f README.md "$STAGE/README.md"
          [ -f assets/icon.png ] && cp -f assets/icon.png "$STAGE/icon.png"
          tar -czf "release-assets/PoundControl_${TAG}_linux_amd64.tar.gz" -C "$STAGE" .

          echo "Cross-compiling Windows amd64 Studio portable binary..."
          VERSION="$VER" ./build.sh gui-win
          cp -f build/bin/poundcontrol.exe "release-assets/PoundControl_${TAG}_windows_amd64.exe"

          echo "Building Windows amd64 Guided Setup Installer..."
          VERSION="$VER" ./build.sh installer
          cp -f build/bin/PoundControl-Setup.exe "release-assets/PoundControl_${TAG}_windows_amd64_setup.exe"

      - name: Upload Linux & Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: release-assets/

  build-gui-macos:
    name: Build Desktop GUI (macOS)
    needs: meta
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.3

      - name: Build macOS GUI
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p release-assets
          TAG="${{ needs.meta.outputs.tag }}"
          VER="${{ needs.meta.outputs.version }}"
          APP_VER="${VER%%-*}"
          if [ -z "$APP_VER" ]; then
            APP_VER="0.1.0"
          fi

          fyne package -os darwin -app-id com.github.mrpoundsign.poundcontrol -name PoundControl -app-version "$APP_VER" -icon "$PWD/assets/icon.png" -src ./cmd/poundcontrol
          MAIN_BIN=$(find PoundControl.app/Contents/MacOS -maxdepth 1 -type f | head -n 1)
          test -n "$MAIN_BIN" || (echo "macOS bundle executable not found" && exit 1)
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w -X github.com/mrpoundsign/PoundControl/internal/version.Version=$VER" -o "$MAIN_BIN" ./cmd/poundcontrol
          zip -r "release-assets/PoundControl_${TAG}_darwin_all.zip" PoundControl.app

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: release-assets/

  build-android:
    name: Build Android & Wear OS Companion APKs
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK Components
        run: |
          SDK_MGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MGR" --licenses >/dev/null || true
          "$SDK_MGR" "platforms;android-37" "build-tools;36.0.0"

      - name: Test & Assemble Android & Wear OS APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          TAG="${{ needs.meta.outputs.tag }}"
          VER_NAME="${{ needs.meta.outputs.version }}"
          BASE_VER="${VER_NAME%%-*}"
          IFS='.' read -r MAJ MIN PAT <<< "$BASE_VER"
          MAJ="${MAJ//[^0-9]/}"
          MIN="${MIN//[^0-9]/}"
          PAT="${PAT//[^0-9]/}"
          VER_CODE=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          if [ "$VER_CODE" -lt 1 ]; then
            VER_CODE=1
          fi

          cd mobile/android
          chmod +x ./gradlew

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Building release-signed Android & Wear OS APKs..."
            KS_FILE="$(mktemp)"
            trap 'rm -f "$KS_FILE"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS_FILE"
            ANDROID_KEYSTORE_PATH="$KS_FILE" ./gradlew :protocol:testDebugUnitTest :app:testDebugUnitTest :wear:testDebugUnitTest :app:assembleRelease :wear:assembleRelease \
              -PappVersionName="$VER_NAME" -PappVersionCode="$VER_CODE" --no-daemon
            cp -f app/build/outputs/apk/release/app-release.apk "../../release-assets/PoundControl_${TAG}_android.apk"
            cp -f wear/build/outputs/apk/release/wear-release.apk "../../release-assets/PoundControl_${TAG}_wear.apk"
          else
            echo "No release keystore secrets configured; building installable debug-signed Android & Wear OS APKs..."
            ./gradlew :protocol:testDebugUnitTest :app:testDebugUnitTest :wear:testDebugUnitTest :app:assembleDebug :wear:assembleDebug \
              -PappVersionName="$VER_NAME" -PappVersionCode="$VER_CODE" --no-daemon
            cp -f app/build/outputs/apk/debug/app-debug.apk "../../release-assets/PoundControl_${TAG}_android.apk"
            cp -f wear/build/outputs/apk/debug/wear-debug.apk "../../release-assets/PoundControl_${TAG}_wear.apk"
          fi

      - name: Upload Android & Wear OS APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: release-assets/

  release:
    name: Release PoundControl Artifacts
    needs: [meta, test, build-gui-linux-windows, build-gui-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Verify Clean Git State
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "Dirty git state detected:" && git status && exit 1)

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ needs.meta.outputs.is_tag == 'true' && 'release --clean' || 'release --clean --snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release-assets
          merge-multiple: true

      - name: Consolidate Checksums
        run: |
          mkdir -p dist
          cd release-assets
          TMP_SUMS="$(mktemp)"
          for f in *; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> "$TMP_SUMS"
          done
          sort -u -k2 -o ../dist/checksums.txt "$TMP_SUMS"
          rm -f "$TMP_SUMS"
          cd ..
          cp -f dist/checksums.txt dist/SHA256SUMS.txt
          echo "=== Final Consolidated dist/checksums.txt ==="
          cat dist/checksums.txt

      - name: Attest Build Provenance (SLSA OIDC)
        if: needs.meta.outputs.is_tag == 'true'
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish GitHub Release
        if: needs.meta.outputs.is_tag == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            FLAGS=(--verify-tag --generate-notes)
            if [ "${{ needs.meta.outputs.prerelease }}" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
          ASSETS=()
          for f in release-assets/*; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          ASSETS+=(dist/checksums.txt dist/SHA256SUMS.txt)
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
